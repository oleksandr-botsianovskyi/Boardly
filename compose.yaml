services:
  postgres:
    image: postgres:18-alpine
    container_name: boardly-postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: boardly
      POSTGRES_PASSWORD: boardly_dev_password
      POSTGRES_DB: boardly

    ports:
      - "5432:5432"

    volumes:
      - boardly_postgres_data:/var/lib/postgresql

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U boardly -d boardly"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  boardly_postgres_data:
